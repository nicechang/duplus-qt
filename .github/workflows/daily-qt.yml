name: Daily Duplus QT

on:
  schedule:
    # 한국시간(KST) 매일 오전 5:00 = UTC 20:00
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl today's QT
        env:
          TZ: Asia/Seoul
        run: |
          TODAY=$(date +%F)
          mkdir -p qt
          python3 crawl_duplus_qt.py --date "$TODAY" --output-dir "qt"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qt/
          if ! git diff --staged --quiet; then
            git commit -m "chore: add QT for $(TZ=Asia/Seoul date +%F)"
            git push
          fi
